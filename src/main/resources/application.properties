# Server Port Configuration
server.port=8080

# Spring Application Name
spring.application.name=quizflow-backend

# ==========================================
# DATABASE CONFIGURATION (Default: H2 In-Memory with MySQL compatibility mode)
# ==========================================
spring.datasource.url=jdbc:h2:mem:quizflowdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Initialization Settings
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:qthtm_c3_c6_full.sql,classpath:qthtm_c4_c5_full.sql,classpath:qthtm_k14_cau_1_100_chuan.sql,classpath:qthtm_k14_cau_101_190_chuan.sql,classpath:qthtm_cuoicung_cau_1_100.sql,classpath:qthtm_cuoicung_cau_101_178.sql,classpath:qthtm_bosung_de_tong_hop_v2.sql,classpath:iot_115_cau.sql

# ==========================================
# POSTGRESQL CONFIGURATION (Commented out)
# ==========================================
# spring.datasource.url=jdbc:postgresql://localhost:5422/quizflow
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.datasource.driverClassName=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Note: For PostgreSQL, use the line below instead:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Auto DDL Generation (create-drop, update, validate, none)
spring.jpa.hibernate.ddl-auto=none

# Show and Format SQL in Logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable validation check
spring.mvc.format.date-time=iso

# Disable static resource caching (dev mode)
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
