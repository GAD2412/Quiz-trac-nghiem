# Server Port Configuration
server.port=${PORT:8081}

# Spring Application Name
spring.application.name=quizflow-backend

# ==========================================
# DATABASE CONFIGURATION
# Default: H2 in-memory (local dev). On Render, set SPRING_DATASOURCE_URL /
# SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD env vars to point
# at the managed Postgres instance and these defaults are overridden.
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:quizflowdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Initialization Settings
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:qthtm_c3_c6_full.sql,classpath:qthtm_c4_c5_full.sql,classpath:qthtm_k14_cau_1_100_chuan.sql,classpath:qthtm_k14_cau_101_190_chuan.sql,classpath:qthtm_cuoicung_cau_1_100.sql,classpath:qthtm_cuoicung_cau_101_178.sql,classpath:qthtm_bosung_de_tong_hop_v2.sql,classpath:iot_115_cau.sql,classpath:iot_200_cau_full.sql,classpath:dienluc_on_thi.sql

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# Dialect is auto-detected from the JDBC URL by Hibernate 6, no need to pin it.
# ==========================================

# Auto DDL Generation (create-drop, update, validate, none)
spring.jpa.hibernate.ddl-auto=none

# Show and Format SQL in Logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable validation check
spring.mvc.format.date-time=iso

# Disable static resource caching (dev mode)
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
