<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;font-family:'Plus Jakarta Sans',sans-serif;}
body{-webkit-font-smoothing:antialiased;display:flex;background:#f5f6fa;}
input,button,textarea,select{font-family:inherit;}
::selection{background:rgba(99,102,241,.22);}
*::-webkit-scrollbar{width:8px;}
*::-webkit-scrollbar-thumb{background:rgba(130,140,170,.3);border-radius:8px;}
*::-webkit-scrollbar-thumb:hover{background:rgba(130,140,170,.5);}
*::-webkit-scrollbar-track{background:transparent;}

/* Dark mode */
body.dark{background:#0f1320;color:#e7ecff;}
body.dark .surface{background:#171d2e!important;}
body.dark .surface2{background:#1e2540!important;}
body.dark .border-c{border-color:#2a3150!important;}
body.dark .text{color:#e7ecff!important;}
body.dark .text2{color:#8b95b8!important;}
body.dark .text3{color:#5a648a!important;}

/* Layout */
#app{display:flex;width:100%;min-height:100vh;min-width:0;}
aside{width:260px;flex:none;display:flex;flex-direction:column;background:#fff;border-right:1px solid #e9ebf2;height:100vh;position:sticky;top:0;}
aside.collapsed{width:68px;}
main{flex:1;min-width:0;display:flex;flex-direction:column;}

/* Sidebar */
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:15px 16px;height:64px;border-bottom:1px solid #e9ebf2;}
.logo-icon{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3);}
.logo-text{font-size:18px;font-weight:800;letter-spacing:-.02em;color:#171a23;flex:1;}
.collapse-btn{flex:none;width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:#959bb0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.collapse-btn:hover{background:#f1f3f9;}

.sidebar-search{padding:10px 14px;}
.search-wrap{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f1f3f9;border-radius:10px;}
.search-wrap input{border:none;background:transparent;outline:none;flex:1;font-size:13.5px;color:#171a23;}

.subjects-label{padding:6px 22px;font-size:11px;font-weight:700;letter-spacing:.09em;color:#959bb0;text-transform:uppercase;}
.subject-list{flex:1;overflow-y:auto;padding:4px 8px;}
.subject-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;transition:background .15s;}
.subject-item:hover{background:#f1f3f9;}
.subject-item.active{background:#eef1ff;}
.subject-chip{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.subject-name{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.subject-count{font-size:12px;font-weight:600;color:#959bb0;background:#f1f3f9;padding:2px 7px;border-radius:999px;}
.home-nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:8px;color:#5b6178;font-size:14px;font-weight:600;transition:background .15s;}
.home-nav:hover{background:#f1f3f9;}
.home-nav.active{background:#eef1ff;color:#6366f1;}
.sidebar-footer{padding:12px;border-top:1px solid #e9ebf2;}
.new-subject-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border-radius:10px;border:none;background:#f1f3f9;color:#5b6178;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;}
.new-subject-btn:hover{background:#e2e5f0;}

/* Header */
header{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid #e9ebf2;background:#fff;}
.breadcrumb{display:flex;align-items:center;gap:6px;flex:1;}
.crumb-btn{border:none;background:transparent;font-size:14px;font-weight:600;color:#959bb0;cursor:pointer;padding:4px 6px;border-radius:7px;}
.crumb-btn:hover{background:#f1f3f9;}
.crumb-btn.active{color:#171a23;}
.header-right{display:flex;align-items:center;gap:10px;}
.streak-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fff6e6;color:#f59e0b;font-weight:700;font-size:13px;}
.theme-btn{width:38px;height:38px;border-radius:10px;border:1px solid #e9ebf2;background:#fff;color:#5b6178;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.theme-btn:hover{background:#f1f3f9;}
.avatar{width:36px;height:36px;border-radius:999px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}

/* Content */
.content{flex:1;overflow-y:auto;}
.page{max-width:960px;margin:0 auto;padding:32px 36px 72px;width:100%;}

/* Home */
.welcome-banner{border-radius:20px;background:linear-gradient(135deg,#6366f1,#4f46e5);padding:24px 28px;margin-bottom:26px;color:#fff;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;box-shadow:0 12px 40px rgba(99,102,241,.25);position:relative;overflow:hidden;}
.welcome-banner::before{content:'';position:absolute;right:-18px;top:-28px;width:180px;height:180px;border-radius:999px;background:rgba(255,255,255,.07);}
.welcome-text h1{margin:0 0 6px;font-size:26px;font-weight:800;color:#fff;}
.welcome-text p{margin:0;font-size:14px;color:rgba(255,255,255,.78);font-weight:500;}
.welcome-date{font-size:11.5px;color:rgba(255,255,255,.6);font-weight:600;margin-bottom:8px;letter-spacing:.04em;}
.today-goal-card{background:rgba(255,255,255,.13);border-radius:14px;padding:14px 18px;min-width:200px;}
.goal-bar-wrap{height:6px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;margin:8px 0 6px;}
.goal-bar{height:100%;border-radius:999px;background:#fff;}

/* Continue studying */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{margin:0;font-size:17px;font-weight:700;color:#171a23;}
.see-all-btn{font-size:13px;font-weight:600;color:#6366f1;background:none;border:none;cursor:pointer;padding:5px 9px;border-radius:8px;}
.see-all-btn:hover{background:#eef1ff;}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;margin-bottom:28px;}
.chapter-card{background:#fff;border:1px solid #e9ebf2;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(20,30,60,.06);transition:transform .18s,box-shadow .2s;cursor:pointer;}
.chapter-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,30,60,.1);}
.card-top{display:flex;align-items:center;justify-content:space-between;}
.subject-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.pct-badge{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.chapter-name{font-size:15px;font-weight:700;color:#171a23;}
.chapter-meta{font-size:12.5px;color:#5b6178;font-weight:500;}
.progress-bar-wrap{height:5px;border-radius:999px;background:#e9ecf4;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:999px;transition:width .4s;}
.resume-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-radius:9px;border:1px solid #e9ebf2;background:transparent;color:#5b6178;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.resume-btn:hover{background:#f1f3f9;}

/* Dashboard */
.hero-chip{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;}
.subject-hero{display:flex;gap:16px;align-items:center;margin-bottom:24px;}
.subject-hero h1{margin:0;font-size:28px;font-weight:800;color:#171a23;}
.subject-hero p{margin:4px 0 0;font-size:14px;color:#5b6178;}
.mastery-card{background:#fff;border:1px solid #e9ebf2;border-radius:16px;padding:18px 22px;margin-bottom:26px;box-shadow:0 1px 3px rgba(20,30,60,.06);}
.mastery-label{font-size:13px;font-weight:700;color:#5b6178;}
.mastery-pct{font-size:18px;font-weight:800;color:#6366f1;}
.topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.topic-card{background:#fff;border:1px solid #e9ebf2;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 3px rgba(20,30,60,.06);transition:transform .18s;}
.topic-card:hover{transform:translateY(-2px);}
.topic-name{font-size:15px;font-weight:700;color:#171a23;}
.topic-meta{font-size:13px;color:#5b6178;display:flex;align-items:center;gap:5px;}
.topic-actions{display:flex;gap:8px;}
.study-btn{display:flex;align-items:center;gap:6px;flex:1;padding:9px 14px;border-radius:10px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:600;cursor:pointer;justify-content:center;transition:all .15s;}
.study-btn:hover{background:#4f46e5;}

/* Study mode */
.study-page{max-width:720px;margin:0 auto;padding:28px 32px 72px;width:100%;}
.study-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.study-progress{height:7px;border-radius:999px;background:#e9ecf4;overflow:hidden;margin-bottom:24px;}
.study-progress-fill{height:100%;border-radius:999px;background:#6366f1;transition:width .4s;}
.card-shell{background:#fff;border:1px solid #e9ebf2;border-radius:20px;padding:28px 30px;box-shadow:0 2px 8px rgba(20,30,60,.08);margin-bottom:20px;}
.mc-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#eef1ff;color:#4f46e5;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:16px;}
.card-question{font-size:21px;line-height:1.4;font-weight:700;color:#171a23;}
.code-block{margin:14px 0 0;padding:13px 16px;background:#0f1320;border-radius:11px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;color:#e7ecff;overflow-x:auto;white-space:pre;}
.options-list{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
.option-btn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;border:1.5px solid #e9ebf2;background:#fff;text-align:left;cursor:pointer;transition:all .18s;font-size:14.5px;color:#171a23;font-weight:500;}
.option-btn:hover:not(:disabled){border-color:#6366f1;background:#f5f6ff;}
.option-btn .letter{flex:none;width:30px;height:30px;border-radius:8px;background:#f1f3f9;color:#5b6178;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.option-btn.correct{border-color:#10b981;background:#e8f8f1;}
.option-btn.correct .letter{background:#10b981;color:#fff;}
.option-btn.wrong{border-color:#f43f5e;background:#fff0f3;}
.option-btn.wrong .letter{background:#f43f5e;color:#fff;}
.explanation-box{margin-top:16px;padding:14px 16px;border-radius:13px;background:#e8f8f1;border:1px solid #a7e8cf;}
.explanation-correct{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
.exp-letter{flex:none;width:26px;height:26px;border-radius:8px;background:#10b981;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.exp-text{font-size:14px;font-weight:600;color:#171a23;padding-top:3px;}
.exp-body{font-size:14.5px;line-height:1.6;color:#5b6178;font-weight:500;}
.study-nav{display:flex;align-items:center;gap:10px;margin-top:20px;}
.nav-btn{display:flex;align-items:center;gap:6px;padding:11px 16px;border-radius:11px;border:1px solid #e9ebf2;background:#fff;color:#5b6178;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
.nav-btn:hover{background:#f1f3f9;}
.next-btn{display:flex;align-items:center;gap:7px;padding:11px 20px;border-radius:11px;border:none;background:#6366f1;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-left:auto;transition:all .15s;}
.next-btn:hover{background:#4f46e5;}

/* Complete screen */
.complete-screen{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px;}
.trophy-icon{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,#f59e0b,#fb923c);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 12px 36px rgba(245,158,11,.35);}
.complete-screen h2{margin:0 0 8px;font-size:28px;font-weight:800;color:#171a23;}
.complete-screen p{margin:0 0 26px;font-size:15px;color:#5b6178;}
.complete-actions{display:flex;gap:10px;}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:80px;color:#959bb0;font-size:15px;font-weight:600;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .3s ease;}

/* SVG icons */
svg{display:block;flex:none;}

/* Study layout with notes panel */
.study-layout{display:flex;gap:20px;align-items:flex-start;max-width:1200px;margin:0 auto;padding:28px 28px 72px;width:100%;}
.study-main{flex:1;min-width:0;}
.study-page.with-layout{max-width:none;margin:0;padding:0;}

/* Highlight toolbar */
.highlight-toolbar{display:none;position:fixed;z-index:999;background:#1e2540;border-radius:10px;padding:5px 8px;gap:5px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);}
.highlight-toolbar.visible{display:flex;}
.hl-btn{width:24px;height:24px;border-radius:6px;border:none;cursor:pointer;transition:transform .12s;}
.hl-btn:hover{transform:scale(1.15);}
.hl-btn.yellow{background:#fde68a;}
.hl-btn.green{background:#86efac;}
.hl-btn.blue{background:#93c5fd;}
.hl-btn.pink{background:#f9a8d4;}
.hl-btn.clear{background:#e9ebf2;color:#5b6178;font-size:11px;font-weight:700;width:auto;padding:0 8px;}
mark.hl-yellow{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px;}
mark.hl-green{background:#86efac;color:inherit;border-radius:3px;padding:0 1px;}
mark.hl-blue{background:#93c5fd;color:inherit;border-radius:3px;padding:0 1px;}
mark.hl-pink{background:#f9a8d4;color:inherit;border-radius:3px;padding:0 1px;}

/* Notes panel */
.notes-panel{width:300px;flex:none;position:sticky;top:28px;}
.notes-toggle-btn{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;border:1px solid #e9ebf2;background:#fff;color:#5b6178;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;width:100%;justify-content:center;margin-bottom:10px;}
.notes-toggle-btn:hover{background:#f1f3f9;}
.notes-toggle-btn.active{background:#eef1ff;border-color:#c7d0fb;color:#4f46e5;}
.notes-box{background:#fff;border:1px solid #e9ebf2;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(20,30,60,.08);}
.notes-box-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e9ebf2;background:#fafbff;}
.notes-box-title{font-size:13px;font-weight:700;color:#171a23;display:flex;align-items:center;gap:6px;}
.notes-scope{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;cursor:pointer;transition:all .15s;}
.notes-scope.card-scope{background:#eef1ff;color:#4f46e5;}
.notes-scope.topic-scope{background:#e8f8f1;color:#059669;}
.notes-scope.card-scope:hover{background:#e0e5ff;}
.notes-scope.topic-scope:hover{background:#d1f5e6;}
.notes-body{padding:12px 14px;}
.notes-textarea{width:100%;min-height:160px;border:1.5px solid #e9ebf2;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;font-family:inherit;color:#171a23;resize:vertical;outline:none;transition:border-color .15s;background:#fafbff;}
.notes-textarea:focus{border-color:#6366f1;background:#fff;}
.notes-actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.notes-saved-indicator{font-size:11.5px;color:#10b981;font-weight:600;opacity:0;transition:opacity .3s;}
.notes-saved-indicator.show{opacity:1;}
.notes-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;}
.note-item{background:#f5f6fa;border-radius:9px;padding:9px 11px;font-size:12.5px;color:#5b6178;line-height:1.5;display:flex;gap:8px;align-items:flex-start;}
.note-item-label{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;flex:none;margin-top:1px;}
.note-item-label.card{background:#eef1ff;color:#4f46e5;}
.note-item-label.topic{background:#e8f8f1;color:#059669;}
.note-item-text{flex:1;word-break:break-word;}
.note-item-del{flex:none;width:18px;height:18px;border-radius:5px;border:none;background:transparent;color:#c0c5d0;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.note-item-del:hover{background:#fee2e2;color:#f43f5e;}
.notes-empty{text-align:center;padding:20px 0;font-size:13px;color:#c0c5d0;font-weight:500;}

/* Mobile menu button (hidden on desktop) */
.mobile-menu-btn{display:none;}
.sidebar-backdrop{display:none;}

/* ============================================================
   Responsive: tablet & mobile
   ============================================================ */
@media (max-width:900px){
  .study-layout{flex-direction:column;}
  .notes-panel{width:100%;position:static;}
}

@media (max-width:768px){
  html,body{overflow-x:hidden;}
  #app{position:relative;}

  /* Sidebar becomes an off-canvas drawer */
  aside{position:fixed;left:0;top:0;bottom:0;width:78vw;max-width:300px;z-index:200;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 0 rgba(0,0,0,0);}
  aside.mobile-open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.25);}
  aside.collapsed{width:78vw;max-width:300px;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,19,32,.45);z-index:190;}
  .sidebar-backdrop.visible{display:block;}
  .collapse-btn{display:none;}

  main{width:100%;}
  header{padding:0 12px;gap:8px;height:56px;}
  .mobile-menu-btn{display:flex;flex:none;width:36px;height:36px;border-radius:9px;border:1px solid #e9ebf2;background:#fff;color:#5b6178;align-items:center;justify-content:center;cursor:pointer;}
  .breadcrumb{gap:3px;overflow-x:auto;white-space:nowrap;-ms-overflow-style:none;scrollbar-width:none;}
  .breadcrumb::-webkit-scrollbar{display:none;}
  .crumb-btn{font-size:13px;padding:4px 5px;flex:none;}
  .streak-badge{padding:5px 9px;font-size:12px;}
  .theme-btn{width:34px;height:34px;}
  .avatar{width:32px;height:32px;font-size:12px;}

  .page{padding:16px 14px 56px;}
  .welcome-banner{flex-direction:column;padding:18px 18px 20px;border-radius:16px;gap:14px;}
  .welcome-banner > *{min-width:0;width:100%;}
  .welcome-text h1{font-size:20px;}
  .welcome-text p{font-size:13px;}
  .today-goal-card{width:100%;min-width:0;}

  .section-title{font-size:15.5px;}
  .chapter-grid,.topics-grid{grid-template-columns:1fr;gap:12px;}
  .chapter-card,.topic-card{padding:15px;}

  .subject-hero{gap:12px;margin-bottom:18px;}
  .hero-chip{width:44px;height:44px;border-radius:12px;}
  .subject-hero h1{font-size:21px;}
  .mastery-card{padding:15px 16px;}

  /* Study mode */
  .study-layout{padding:14px 12px 56px;gap:14px;}
  .study-page.with-layout{padding:0;}
  .card-shell{padding:18px 16px;border-radius:16px;}
  .card-question{font-size:17.5px;}
  .study-header span{font-size:13px;}
  .option-btn{padding:11px 13px;font-size:14px;}
  .option-btn .letter{width:26px;height:26px;font-size:12px;}
  .study-nav{flex-wrap:wrap;}
  .nav-btn,.next-btn{padding:10px 14px;font-size:13.5px;}
  .next-btn{margin-left:0;flex:1;justify-content:center;}
  .study-nav > div:first-child:empty{display:none;}

  .complete-screen{padding:40px 16px;}
  .complete-actions{width:100%;flex-direction:column;}
  .complete-actions button{width:100%;justify-content:center;}

  /* Notes panel sits full-width below the card on mobile */
  .notes-panel{position:static;}
}
</style>
</head>
<body>
<div id="highlight-toolbar" class="highlight-toolbar">
  <button class="hl-btn yellow" title="Vàng" onclick="applyHighlight('yellow')"></button>
  <button class="hl-btn green" title="Xanh lá" onclick="applyHighlight('green')"></button>
  <button class="hl-btn blue" title="Xanh dương" onclick="applyHighlight('blue')"></button>
  <button class="hl-btn pink" title="Hồng" onclick="applyHighlight('pink')"></button>
  <button class="hl-btn clear" onclick="clearHighlight()">Xóa</button>
</div>
<div id="app">
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeMobileSidebar()"></div>
  <aside id="sidebar">

          </span>
          <span id="home-label">Trang chủ</span>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

<script>
let state = {
  subjects: [],
  view: 'home',
  selectedSubjectId: null,
  selectedTopicId: null,
  selectedTopicName: '',
  cards: [],
  cardIndex: 0,
  selected: null,
  answered: false,
  score: 0,
  dark: false,
  collapsed: false,
  search: '',
  shuffled: false,
  rawCards: []
};

// ── Icons ──────────────────────────────────────────────────────────────────
const ICONS = {
  network:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M12 8v3M8.5 17.5 12 11M15.5 17.5 12 11"/></svg>',
  database:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>',
  chart:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>',
  cpu:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>',
  book:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  layers:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>',
  default:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>'
};
function getIcon(name, size=16){
  const icon = ICONS[name?.toLowerCase()] || ICONS.default;
  return icon.replace(/width="16" height="16"/g, `width="${size}" height="${size}"`);
}

// ── Theme ──────────────────────────────────────────────────────────────────
function toggleTheme(){
  state.dark = !state.dark;
  document.body.classList.toggle('dark', state.dark);
  const icon = document.getElementById('theme-icon');
  if(state.dark){
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.1-14.1 1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2m-4.9-7.1-1.4 1.4M6.3 17.7l-1.4 1.4"/>';
  } else {
    icon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>';
  }
}

// ── Mobile sidebar drawer ─────────────────────────────────────────────────
function openMobileSidebar(){
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebar-backdrop').classList.add('visible');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebar-backdrop').classList.remove('visible');
}

// ── Sidebar collapse ───────────────────────────────────────────────────────
document.getElementById('collapse-btn').onclick = function(){
  state.collapsed = !state.collapsed;
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed', state.collapsed);
  ['logo-label','home-label','subjects-label','new-subj-label','sidebar-search'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.style.display = state.collapsed ? 'none' : '';
  });
};

// ── Filter subjects ────────────────────────────────────────────────────────
function filterSubjects(q){
  state.search = q.toLowerCase();
  renderSidebar();
}

// ── API calls ──────────────────────────────────────────────────────────────
async function fetchSubjects(){
  // Dữ liệu tĩnh sinh bởi scripts/export_static.py (không cần backend)
  const r = await fetch('data/subjects.json');
  return r.json();
}
async function fetchTopicCards(topicId){
  const r = await fetch(`data/topics/${topicId}.json`);
  return r.json();
}

// ── Sidebar render ─────────────────────────────────────────────────────────
function renderSidebar(){
  const list = document.getElementById('subject-list-inner');
  const filtered = state.subjects.filter(s => s.name.toLowerCase().includes(state.search));
  list.innerHTML = filtered.map(s => {
    const total = (s.topics||[]).reduce((a,t)=>a+t.cardCount,0);
    const isActive = s.id === state.selectedSubjectId && state.view === 'dashboard';
    return `<div class="subject-item${isActive?' active':''}" onclick="selectSubject(${s.id})">
      <span class="subject-chip" style="background:${s.color}22;color:${s.color};">${getIcon(s.icon)}</span>
      <span class="subject-name">${s.name}</span>
      <span class="subject-count">${total}</span>
    </div>`;
  }).join('');

  document.getElementById('home-nav').className = 'home-nav' + (state.view==='home'?' active':'');
}

function updateBreadcrumb(){
  const bc = document.getElementById('breadcrumb');
  if(state.view === 'home'){
    bc.innerHTML = `<button class="crumb-btn active">Trang chủ</button>`;
  } else if(state.view === 'dashboard'){
    const s = state.subjects.find(x=>x.id===state.selectedSubjectId);
    bc.innerHTML = `<button class="crumb-btn" onclick="goHome()">Trang chủ</button>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#959bb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <button class="crumb-btn active">${s?.name||''}</button>`;
  } else if(state.view === 'study'){
    const s = state.subjects.find(x=>x.id===state.selectedSubjectId);
    bc.innerHTML = `<button class="crumb-btn" onclick="goHome()">Trang chủ</button>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#959bb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <button class="crumb-btn" onclick="selectSubject(${state.selectedSubjectId})">${s?.name||''}</button>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#959bb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <button class="crumb-btn active">${state.selectedTopicName}</button>`;
  }
}

// ── HOME view ──────────────────────────────────────────────────────────────
function renderHome(){
  const today = new Date().toLocaleDateString('vi-VN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  // Recent chapters = first topic from each subject
  const recent = [];
  state.subjects.forEach(s => {
    if(s.topics && s.topics.length){
      const t = s.topics[0];
      recent.push({subject:s, topic:t});
    }
  });
  const recentCards = recent.slice(0,3).map(({subject:s, topic:t}) => {
    const pct = t.cardCount > 0 ? Math.round(t.masteredCount/t.cardCount*100) : 0;
    const pctColor = pct>=80?'#10b981':pct>=50?'#f59e0b':'#6366f1';
    return `<div class="chapter-card" onclick="startStudy(${s.id},${t.id},'${escHtml(t.name)}')">
      <div class="card-top">
        <span class="subject-badge" style="background:${s.color}18;color:${s.color};">${getIcon(s.icon)} ${escHtml(s.name)}</span>
        <span class="pct-badge" style="background:${pctColor}18;color:${pctColor};">${pct}%</span>
      </div>
      <div class="chapter-name">${escHtml(t.name)}</div>
      <div class="chapter-meta">${t.masteredCount}/${t.cardCount} câu đã học</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${pctColor};"></div></div>
      <button class="resume-btn" onclick="event.stopPropagation();startStudy(${s.id},${t.id},'${escHtml(t.name)}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg> Học ngay
      </button>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `<div class="page fade-up">
    <div class="welcome-banner">
      <div style="position:relative;">
        <div class="welcome-date">${today}</div>
        <div class="welcome-text"><h1>Chào mừng trở lại! ✨</h1><p>Sẵn sàng chinh phục mục tiêu hôm nay chưa?</p></div>
      </div>
      <div class="today-goal-card">
        <div style="font-size:10.5px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;">Tiến độ hôm nay</div>
        <div style="font-size:12.5px;font-weight:700;color:rgba(255,255,255,.9);">${state.subjects.reduce((a,s)=>(s.topics||[]).reduce((b,t)=>b+t.masteredCount,a),0)} câu đã học</div>
        <div class="goal-bar-wrap"><div class="goal-bar" style="width:42%;"></div></div>
        <div style="font-size:11.5px;color:rgba(255,255,255,.7);font-weight:500;">Tiếp tục học để duy trì streak!</div>
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title">Tiếp tục học</h2>
    </div>
    <div class="chapter-grid">${recentCards || '<div style="color:#959bb0;font-size:14px;">Chưa có dữ liệu.</div>'}</div>

    <div class="section-header"><h2 class="section-title">Tất cả môn học</h2></div>
    <div class="chapter-grid">
      ${state.subjects.map(s => {
        const total = (s.topics||[]).reduce((a,t)=>a+t.cardCount,0);
        const mastered = (s.topics||[]).reduce((a,t)=>a+t.masteredCount,0);
        const pct = total>0?Math.round(mastered/total*100):0;
        return `<div class="chapter-card" onclick="selectSubject(${s.id})">
          <div class="card-top">
            <span class="subject-badge" style="background:${s.color}18;color:${s.color};">${getIcon(s.icon)} ${escHtml(s.name)}</span>
            <span class="pct-badge" style="background:#6366f118;color:#6366f1;">${pct}%</span>
          </div>
          <div class="chapter-name">${escHtml(s.name)}</div>
          <div class="chapter-meta">${(s.topics||[]).length} chủ đề · ${total} câu hỏi</div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${s.color};"></div></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ── DASHBOARD view ─────────────────────────────────────────────────────────
function renderDashboard(){
  const s = state.subjects.find(x=>x.id===state.selectedSubjectId);
  if(!s){renderHome();return;}
  const total = (s.topics||[]).reduce((a,t)=>a+t.cardCount,0);
  const mastered = (s.topics||[]).reduce((a,t)=>a+t.masteredCount,0);
  const overallPct = total>0?Math.round(mastered/total*100):0;

  const topicsHtml = (s.topics||[]).map(t => {
    const pct = t.cardCount>0?Math.round(t.masteredCount/t.cardCount*100):0;
    const pctColor = pct>=80?'#10b981':pct>=50?'#f59e0b':'#6366f1';
    return `<div class="topic-card">
      <div class="topic-name">${escHtml(t.name)}</div>
      <div class="topic-meta">${getIcon('layers')} ${t.cardCount} câu · ${t.masteredCount} đã học</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${pctColor};"></div></div>
      <div class="topic-actions">
        <button class="study-btn" onclick="startStudy(${s.id},${t.id},'${escHtml(t.name)}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg> Học ngay
        </button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `<div class="page fade-up">
    <div class="subject-hero">
      <div class="hero-chip" style="background:${s.color}18;color:${s.color};">${getIcon(s.icon,24)}</div>
      <div>
        <h1>${escHtml(s.name)}</h1>
        <p>${(s.topics||[]).length} chủ đề · ${total} câu hỏi</p>
      </div>
    </div>
    <div class="mastery-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span class="mastery-label">Tiến độ tổng thể</span>
        <span class="mastery-pct">${overallPct}%</span>
      </div>
      <div class="progress-bar-wrap" style="height:9px;">
        <div class="progress-bar-fill" style="width:${overallPct}%;background:${s.color};"></div>
      </div>
    </div>
    <div class="section-header">
      <h2 class="section-title">Chủ đề</h2>
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#5b6178;cursor:pointer;">
        <input type="checkbox" ${shuffleOn(s.id)?'checked':''} onchange="toggleShuffle(${s.id})"> Xáo trộn câu hỏi &amp; đáp án
      </label>
    </div>
    <div class="topics-grid">${topicsHtml||'<div style="color:#959bb0;">Chưa có chủ đề.</div>'}</div>
  </div>`;
}

// ── STUDY view ─────────────────────────────────────────────────────────────
function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Xáo trộn bật/tắt theo từng môn; mặc định tắt (giữ nguyên thứ tự gốc)
function shuffleOn(subjectId){ try{ return localStorage.getItem(`qf_shuffle_${subjectId}`)==='1'; }catch(e){ return false; } }
function toggleShuffle(subjectId){
  try{
    if(shuffleOn(subjectId)) localStorage.removeItem(`qf_shuffle_${subjectId}`);
    else localStorage.setItem(`qf_shuffle_${subjectId}`,'1');
  }catch(e){}
  renderDashboard();
}

function orderCards(cards){
  if(shuffleOn(state.selectedSubjectId)){
    return shuffleArray(cards).map(card => ({...card, options: shuffleArray(card.options || [])}));
  }
  return [...cards].sort((a,b)=>a.id-b.id).map(card => ({
    ...card,
    options: [...(card.options || [])].sort((a,b)=>(a.displayOrder-b.displayOrder)||(a.id-b.id))
  }));
}

async function startStudy(subjectId, topicId, topicName){
  state.selectedSubjectId = subjectId;
  state.selectedTopicId = topicId;
  state.selectedTopicName = topicName;
  state.view = 'study';
  state.cardIndex = 0;
  state.selected = null;
  state.answered = false;
  state.score = 0;
  state.cards = [];
  state.shuffled = true;
  renderSidebar();
  updateBreadcrumb();
  closeMobileSidebar();
  document.getElementById('content').innerHTML = '<div class="loading">Đang tải câu hỏi...</div>';
  try {
    const data = await fetchTopicCards(topicId);
    state.rawCards = data.quizCards || data || [];
    state.cards = orderCards(state.rawCards);
    renderStudy();
  } catch(e){
    document.getElementById('content').innerHTML = '<div class="loading">Lỗi tải dữ liệu.</div>';
  }
}


function saveStudySession(){
  if(state.view !== 'study') return;
  try {
    sessionStorage.setItem('qf_study', JSON.stringify({
      selectedSubjectId: state.selectedSubjectId,
      selectedTopicId: state.selectedTopicId,
      selectedTopicName: state.selectedTopicName,
      cardIndex: state.cardIndex,
      score: state.score,
      answered: state.answered,
      selected: state.selected,
      shuffled: state.shuffled,
      cards: state.cards,
      rawCards: state.rawCards
    }));
  } catch(e){}
}

function clearStudySession(){
  sessionStorage.removeItem('qf_study');
}

function renderStudy(){
  if(!state.cards.length){
    document.getElementById('content').innerHTML = `<div class="study-page fade-up"><div style="text-align:center;padding:60px 0;color:#959bb0;font-size:15px;font-weight:600;">Chưa có câu hỏi trong chủ đề này.</div></div>`;
    return;
  }
  if(state.cardIndex >= state.cards.length){
    renderComplete();return;
  }
  const card = state.cards[state.cardIndex];
  const cleanQuestion = (card.question || '').replace(/^Câu\s+\d+:\s*/i, '');
  const total = state.cards.length;
  const pct = Math.round(state.cardIndex/total*100);
  const letters = ['A','B','C','D','E','F'];
  const correctOpt = (card.options||[]).find(o=>o.correct);
  const correctLetter = letters[(card.options||[]).indexOf(correctOpt)] || 'A';

  const optionsHtml = (card.options||[]).map((o,i) => {
    let cls = 'option-btn';
    if(state.answered){
      if(o.correct) cls += ' correct';
      else if(i === state.selected && !o.correct) cls += ' wrong';
    }
    const icon = state.answered && o.correct
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`
      : (state.answered && i===state.selected && !o.correct
        ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`
        : '');
    return `<button class="${cls}" onclick="answerCard(${i})" ${state.answered?'disabled':''}>
      <span class="letter">${letters[i]||i}</span>
      <span style="flex:1;">${escHtml(stripOptionPrefix(o.optionText||o.option_text||''))}</span>
      ${icon}
    </button>`;
  }).join('');

  const explanationHtml = state.answered ? `<div class="explanation-box">
    <div class="explanation-correct">
      <span class="exp-letter">${correctLetter}</span>
      <span class="exp-text">${escHtml(stripOptionPrefix(correctOpt?.optionText||''))}</span>
    </div>
    <div class="exp-body">${escHtml(card.explanation||'')}</div>
  </div>` : '';

  const isLast = state.cardIndex >= total-1;
  const nextLabel = isLast ? 'Kết thúc' : 'Tiếp theo';
  const nextIcon = isLast
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

  document.getElementById('content').innerHTML = `<div class="study-layout fade-up">
    <div class="study-main">
      <div class="study-page with-layout">
        <div class="study-header">
          <span style="font-size:14px;font-weight:700;color:#171a23;">Câu ${state.cardIndex+1} / ${total}</span>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:13px;font-weight:600;color:#10b981;">${state.score} đúng</span>
            <button class="nav-btn" style="padding:7px 13px;font-size:12.5px;" onclick="restartStudy()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Làm lại
            </button>
          </div>
        </div>
        <div class="study-progress"><div class="study-progress-fill" style="width:${pct}%;"></div></div>
        <div class="card-shell">
          <div class="mc-tag">${getIcon('layers',12)} Trắc nghiệm</div>
          <div class="card-question" id="hl-question" style="user-select:text;cursor:text;">${escHtml(cleanQuestion)}</div>
          <div style="font-size:11px;color:#c0c5d0;margin-top:6px;margin-bottom:2px;">✏️ Bôi chọn từ để tô màu highlight</div>
          ${card.codeSnippet||card.code_snippet ? `<pre class="code-block">${escHtml(card.codeSnippet||card.code_snippet)}</pre>` : ''}
          <div class="options-list">${optionsHtml}</div>
          ${explanationHtml}
        </div>
        <div class="study-nav">
          ${state.cardIndex > 0 ? `<button class="nav-btn" onclick="prevCard()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Trước
          </button>` : '<div></div>'}
          ${state.answered ? `<button class="next-btn" onclick="nextCard()">${nextLabel} ${nextIcon}</button>` : ''}
        </div>
      </div>
    </div>
    <div class="notes-panel" id="notes-panel"></div>
  </div>`;

  initHighlightable();
  renderNotesPanel();
}

function answerCard(i){
  const card = state.cards[state.cardIndex];
  if(card.userAnswered) return;
  card.userSelected = i;
  card.userAnswered = true;
  
  // Recalculate score based on all answered cards
  state.score = state.cards.filter(c => c.userAnswered && (c.options||[])[c.userSelected]?.correct).length;
  
  state.selected = i;
  state.answered = true;
  
  saveStudySession();
  renderStudy();
}
function nextCard(){
  state.cardIndex++;
  const nextCardObj = state.cards[state.cardIndex];
  if (nextCardObj) {
    state.answered = !!nextCardObj.userAnswered;
    state.selected = nextCardObj.userAnswered ? nextCardObj.userSelected : null;
  } else {
    state.answered = false;
    state.selected = null;
  }
  saveStudySession();
  renderStudy();
}
function prevCard(){
  if(state.cardIndex <= 0) return;
  state.cardIndex--;
  const prevCardObj = state.cards[state.cardIndex];
  state.answered = !!prevCardObj.userAnswered;
  state.selected = prevCardObj.userAnswered ? prevCardObj.userSelected : null;
  saveStudySession();
  renderStudy();
}

function renderComplete(){
  const total = state.cards.length;
  document.getElementById('content').innerHTML = `<div class="study-page fade-up">
    <div class="complete-screen">
      <div class="trophy-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
      </div>
      <h2>Hoàn thành chủ đề!</h2>
      <p>Bạn trả lời đúng <strong style="color:#10b981;">${state.score}</strong> / ${total} câu hỏi.</p>
      <div class="complete-actions">
        <button class="nav-btn" onclick="restartStudy()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Làm lại
        </button>
        <button class="next-btn" onclick="selectSubject(${state.selectedSubjectId})">
          Về chủ đề
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>`;
}

function restartStudy(){
  clearStudySession();
  state.cardIndex = 0;
  state.selected = null;
  state.answered = false;
  state.score = 0;
  state.shuffled = true;
  state.cards = orderCards(state.rawCards);
  saveStudySession();
  renderStudy();
}

// ── Navigation ─────────────────────────────────────────────────────────────
function goHome(){
  state.view = 'home';
  state.selectedSubjectId = null;
  renderSidebar();
  updateBreadcrumb();
  renderHome();
  closeMobileSidebar();
}

function selectSubject(id){
  state.view = 'dashboard';
  state.selectedSubjectId = id;
  renderSidebar();
  updateBreadcrumb();
  renderDashboard();
  closeMobileSidebar();
}

function stripOptionPrefix(str){
  return String(str||'').replace(/^[A-Fa-f1-4][.)]\s*/,'');
}

// ── Highlight ──────────────────────────────────────────────────────────────
const hlStore = {}; // key: topicId_cardId → {html}
let hlToolbarSel = null;

function hlKey(){ return `hl_${state.selectedTopicId}_${state.cards[state.cardIndex]?.id||state.cardIndex}`; }

function loadHighlights(){
  const key = hlKey();
  if(hlStore[key]) return hlStore[key].html;
  try{ const s=localStorage.getItem(key); if(s) return JSON.parse(s).html; }catch(e){}
  return null;
}

function saveHighlights(html){
  const key = hlKey();
  hlStore[key]={html};
  try{localStorage.setItem(key,JSON.stringify({html}));}catch(e){}
}

function initHighlightable(){
  const el = document.getElementById('hl-question');
  if(!el) return;
  const saved = loadHighlights();
  if(saved) el.innerHTML = saved;
  el.addEventListener('mouseup', onTextSelect);
  el.addEventListener('touchend', onTextSelect);
}

function onTextSelect(){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.toString().trim()) { hideHlToolbar(); return; }
  const range = sel.getRangeAt(0);
  const el = document.getElementById('hl-question');
  if(!el || !el.contains(range.commonAncestorContainer)) { hideHlToolbar(); return; }
  hlToolbarSel = sel;
  const rect = range.getBoundingClientRect();
  const tb = document.getElementById('highlight-toolbar');
  tb.style.left = (rect.left + window.scrollX + rect.width/2 - tb.offsetWidth/2) + 'px';
  tb.style.top = (rect.top + window.scrollY - 46) + 'px';
  tb.classList.add('visible');
}

function hideHlToolbar(){
  document.getElementById('highlight-toolbar').classList.remove('visible');
  hlToolbarSel = null;
}

function applyHighlight(color){
  const sel = hlToolbarSel || window.getSelection();
  if(!sel || sel.isCollapsed) return;
  try{
    const range = sel.getRangeAt(0);
    const mark = document.createElement('mark');
    mark.className = 'hl-'+color;
    mark.setAttribute('data-hl', color);
    range.surroundContents(mark);
    sel.removeAllRanges();
  }catch(e){}
  const el = document.getElementById('hl-question');
  if(el) saveHighlights(el.innerHTML);
  hideHlToolbar();
}

function clearHighlight(){
  const el = document.getElementById('hl-question');
  if(!el) return;
  el.querySelectorAll('mark[data-hl]').forEach(m=>{
    const parent = m.parentNode;
    while(m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
  });
  saveHighlights(el.innerHTML);
  hideHlToolbar();
}

document.addEventListener('mousedown', e=>{
  const tb = document.getElementById('highlight-toolbar');
  if(tb && !tb.contains(e.target)) hideHlToolbar();
});

// ── Notes ──────────────────────────────────────────────────────────────────
let notesOpen = false;
let notesScope = 'card'; // 'card' | 'topic'

function notesCardKey(){ return `note_card_${state.selectedTopicId}_${state.cards[state.cardIndex]?.id||state.cardIndex}`; }
function notesTopicKey(){ return `note_topic_${state.selectedTopicId}`; }
function currentNotesKey(){ return notesScope==='card' ? notesCardKey() : notesTopicKey(); }

function getNotes(key){ try{ return localStorage.getItem(key)||''; }catch(e){ return ''; } }
function setNotes(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

function getAllNotes(){
  // Collect all notes for current topic (card-level + topic-level)
  const results = [];
  // topic note
  const tn = getNotes(notesTopicKey());
  if(tn.trim()) results.push({scope:'topic', text:tn});
  // scan card notes (iterate keys)
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(`note_card_${state.selectedTopicId}_`)){
        const v = localStorage.getItem(k);
        if(v && v.trim()) results.push({scope:'card', key:k, text:v});
      }
    }
  }catch(e){}
  return results;
}

function deleteNote(key){
  try{ localStorage.removeItem(key); }catch(e){}
  renderNotesPanel();
}

function toggleNotes(){
  notesOpen = !notesOpen;
  renderNotesPanel();
}

function switchNotesScope(s){
  notesScope = s;
  renderNotesPanel();
}

function renderNotesPanel(){
  const panel = document.getElementById('notes-panel');
  if(!panel) return;
  const key = currentNotesKey();
  const val = getNotes(key);
  const allNotes = getAllNotes();

  panel.innerHTML = `
    <button class="notes-toggle-btn ${notesOpen?'active':''}" onclick="toggleNotes()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Ghi chú ${allNotes.length>0?`<span style="background:#6366f1;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;">${allNotes.length}</span>`:''}
    </button>
    ${notesOpen ? `<div class="notes-box">
      <div class="notes-box-header">
        <span class="notes-box-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          Ghi chú
        </span>
        <div style="display:flex;gap:5px;">
          <span class="notes-scope ${notesScope==='card'?'card-scope':'topic-scope'}" onclick="switchNotesScope('card')" title="Ghi chú cho câu này">Câu này</span>
          <span class="notes-scope ${notesScope==='topic'?'topic-scope':'card-scope'}" onclick="switchNotesScope('topic')" title="Ghi chú cho cả chủ đề">Chủ đề</span>
        </div>
      </div>
      <div class="notes-body">
        <textarea class="notes-textarea" id="notes-ta" placeholder="${notesScope==='card'?'Ghi chú riêng cho câu hỏi này...':'Ghi chú cho cả chủ đề này...'}" oninput="onNotesInput(this)">${escHtml(val)}</textarea>
        <div class="notes-actions">
          <span class="notes-saved-indicator" id="notes-saved">✓ Đã lưu</span>
          <span style="font-size:11px;color:#c0c5d0;">${val.length} ký tự</span>
        </div>
        ${allNotes.length>0 ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid #e9ebf2;">
          <div style="font-size:11.5px;font-weight:700;color:#959bb0;margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase;">Tất cả ghi chú</div>
          <div class="notes-list">
            ${allNotes.map(n=>`<div class="note-item">
              <span class="note-item-label ${n.scope}">${n.scope==='card'?'Câu':'Chủ đề'}</span>
              <span class="note-item-text">${escHtml(n.text.slice(0,120))}${n.text.length>120?'…':''}</span>
              ${n.key?`<button class="note-item-del" onclick="deleteNote('${n.key}')" title="Xóa">×</button>`:''}
            </div>`).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>` : ''}
  `;
}

let notesSaveTimer = null;
function onNotesInput(ta){
  const key = currentNotesKey();
  clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(()=>{
    setNotes(key, ta.value);
    const ind = document.getElementById('notes-saved');
    if(ind){ ind.classList.add('show'); setTimeout(()=>ind.classList.remove('show'),1500); }
    // Re-render just the count badge on toggle button
    const btn = document.querySelector('.notes-toggle-btn');
    if(btn){
      const allNotes = getAllNotes();
      const badge = btn.querySelector('span[style]');
      if(allNotes.length>0 && !badge){
        btn.innerHTML += `<span style="background:#6366f1;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;">${allNotes.length}</span>`;
      }
    }
  }, 600);
}

function escHtml(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init(){
  try {
    state.subjects = await fetchSubjects();

    // Khôi phục session đang làm dở nếu có
    const saved = sessionStorage.getItem('qf_study');
    if(saved){
      try {
        const s = JSON.parse(saved);
        Object.assign(state, {
          view: 'study',
          selectedSubjectId: s.selectedSubjectId,
          selectedTopicId: s.selectedTopicId,
          selectedTopicName: s.selectedTopicName,
          cardIndex: s.cardIndex,
          score: s.score,
          answered: s.answered,
          selected: s.selected,
          shuffled: s.shuffled,
          cards: s.cards,
          rawCards: s.rawCards
        });
        renderSidebar();
        updateBreadcrumb();
        renderStudy();
        return;
      } catch(e){ clearStudySession(); }
    }

    renderSidebar();
    updateBreadcrumb();
    renderHome();
  } catch(e){
    document.getElementById('content').innerHTML = '<div class="loading">Không tải được dữ liệu. Hãy tải lại trang.</div>';
  }
}

init();
</script>
